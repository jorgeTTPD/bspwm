blur: {
  method = "dual_kawase";
  strength = 8;
  background = false;
  background-frame = false;
  background-fixed = false;
}
# Activa el redondeo de esquinas
corner-radius = 25; 

# Esto evita que las esquinas se vean negras o cuadradas
round-borders = 1;

# Importante: lista las ventanas que deben tener bordes redondeados
# Si no tienes nada, añade la ventana "Eww"
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
