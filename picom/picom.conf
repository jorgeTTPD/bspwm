backend = "glx";
vsync = true;

# Blur
blur-background = true;
blur-background-fixed = false;

blur:
{
  method = "dual_kawase";
  strength = 12;
};

# Esquinas redondeadas
corner-radius = 25;
round-borders = 1;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Sombras
shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.6;

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "window_type = 'dock'"
];

# Fade (transiciones suaves - lo mas cercano a animaciones)
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

fade-exclude = [
  "window_type = 'dock'"
];

# Animaciones (nativo de picom-git)
animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.9;
    duration = 0.18;
}, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.9;
    duration = 0.15;
}, {
    triggers = [ "size" ];
    opacity = { duration = 0.15; start = 0.4; end = 1.0; };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    scale-x = { duration = 0.15; start = 0.96; end = 1.0; };
    scale-y = { duration = 0.15; start = 0.96; end = 1.0; };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
})

# Transparencia
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "100:fullscreen",
  "85:window_type = 'dock'",
  "100:window_type = 'desktop'"
];

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1.0; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
