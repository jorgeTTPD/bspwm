[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #89b4fa
disabled = #6c7086

[bar/mi_barra]
width = 100%
height = 24pt
radius = 10
override-redirect = true
wm-restack = bspwm
pseudo-transparency = false
background = #1a1a1a66
foreground = ${colors.foreground}
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=14;2"

modules-left = arch checkupdates sep xworkspaces sep launcher-spotify launcher-btop launcher-files launcher-pipe launcher-git launcher-opencode launcher-freebuff
modules-center = soundbar music-scroll
modules-right = bluetooth cpu memory temperature network battery pulseaudio brightness date powermenu

cursor-click = pointer
enable-ipc = true

[module/arch]
type = custom/text
format = ""
format-font = 1
format-foreground = ${colors.primary}
format-padding = 1
click-left = rofi -show drun

[module/checkupdates]
type = custom/script
exec = ~/.config/polybar/scripts/checkupdates.sh
tail = false
interval = 600
format = <label>
label = %output%
label-foreground = #a6e3a1
click-left = urxvt -e sudo pacman -Syu &

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
tail = false
interval = 10
format = <label>
label = %output%
label-foreground = ${colors.primary}
label-font = 1
click-left = blueman-manager &

[module/sep]
type = custom/text
format = "│"
format-foreground = ${colors.disabled}
format-padding = 0

[module/xworkspaces]
type = internal/xworkspaces
label-active = 
label-active-foreground = ${colors.primary}
label-active-padding = 1
label-occupied = 
label-occupied-padding = 1
label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/music-scroll]
type = custom/script
exec = ~/.config/polybar/scripts/music-scroll.sh
tail = false
interval = 2
format = <label>
label = %output%
label-maxlen = 30
label-foreground = ${colors.foreground}
click-left = playerctl play-pause
click-right = urxvt -e spotatui &
scroll-up = playerctl next
scroll-down = playerctl previous

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.foreground}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.foreground}
label = %percentage_used:2%%

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
format = <label>
label =  %temperature-c%
label-foreground = ${colors.foreground}

[module/network]
type = internal/network
interface-type = wireless
interval = 1
label-connected = 󰛴 %downspeed:7%
label-connected-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.foreground}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.foreground}
animation-charging-framerate = 750

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
tail = true
format = <label>
label = %output%
label-foreground = ${colors.foreground}
click-left = brightnessctl set +5%
click-right = brightnessctl set 5%-
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

[module/soundbar]
type = custom/script
exec = ~/.config/polybar/scripts/soundbar.sh
tail = true
format = <label>
label = %output%
format-foreground = ${colors.foreground}
format-font = 0

[module/launcher-spotify]
type = custom/text
format = ""
format-foreground = ${colors.foreground}
format-font = 1
format-padding = 0
click-left = urxvt -e spotatui &

[module/launcher-btop]
type = custom/text
format = ""
format-foreground = ${colors.foreground}
format-font = 1
format-padding = 0
click-left = urxvt -e btop &

[module/launcher-files]
type = custom/text
format = "󰉋"
format-foreground = ${colors.foreground}
format-font = 1
format-padding = 0
click-left = urxvt -e yazi &

[module/launcher-pipe]
type = custom/text
format = "󰗃"
format-foreground = ${colors.foreground}
format-font = 1
format-padding = 0
click-left = urxvt -e pipe-viewer &

[module/launcher-git]
type = custom/text
format = "󰊤"
format-foreground = ${colors.foreground}
format-font = 1
format-padding = 0
click-left = urxvt -e lazygit &

[module/launcher-opencode]
type = custom/text
format = "󰆍"
format-foreground = ${colors.foreground}
format-font = 1
format-padding = 0
click-left = urxvt -e opencode &

[module/launcher-freebuff]
type = custom/text
format = "󰚩"
format-foreground = ${colors.foreground}
format-font = 1
format-padding = 0
click-left = urxvt -e freebuff &

[module/powermenu]
type = custom/text
format = "  "
format-foreground = #f38ba8
format-font = 1
click-left = ~/.config/scripts/powermenu_rofi.sh &
