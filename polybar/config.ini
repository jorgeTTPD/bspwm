[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #89b4fa
disabled = #6c7086

[bar/mi_barra]
width = 100%
height = 24pt
radius = 10
override-redirect = false
wm-restack = bspwm
pseudo-transparency = false
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=14;2"

modules-left = arch xworkspaces launcher-spotify launcher-btop launcher-files launcher-pipe launcher-git launcher-wa launcher-opencode
modules-center = cava music
modules-right = cpu memory temperature network battery pulseaudio brightness date

cursor-click = pointer
enable-ipc = true

[module/arch]
type = custom/text
content = ""
content-font = 2
content-foreground = ${colors.primary}
content-padding = 1
click-left = rofi -show drun

[module/xworkspaces]
type = internal/xworkspaces
label-active = 
label-active-foreground = ${colors.primary}
label-active-padding = 1
label-occupied = 
label-occupied-padding = 1
label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/music]
type = custom/script
exec = ~/.config/polybar/scripts/musiclyrics.sh
tail = true
label = %output%
label-maxlen = 50
format-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.foreground}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.foreground}
label = %percentage_used:2%%

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
format = <label>
label =  %temperature-c%
label-foreground = ${colors.foreground}

[module/network]
type = internal/network
interface-type = wireless
interval = 1
label-connected = 󰛴 %downspeed:7%
label-connected-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.foreground}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.foreground}
animation-charging-framerate = 750

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
tail = true
format = <label>
label = %output%
label-foreground = ${colors.foreground}
click-left = brightnessctl set +5%
click-right = brightnessctl set 5%-
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

[module/cava]
type = custom/script
exec = ~/.config/polybar/scripts/cava.sh
tail = true
format = <label>
label = %output%
format-foreground = ${colors.foreground}
format-font = 0


[module/launcher-spotify]
type = custom/text
format = "  "
format-foreground = ${colors.foreground}
click-left = urxvt -e spotatui &

[module/launcher-btop]
type = custom/text
format = "  "
format-foreground = ${colors.foreground}
click-left = urxvt -e btop &

[module/launcher-files]
type = custom/text
format = " 󰉋 "
format-foreground = ${colors.foreground}
click-left = urxvt -e yazi &

[module/launcher-pipe]
type = custom/text
format = " 󰗃 "
format-foreground = ${colors.foreground}
click-left = urxvt -e pipe-viewer &

[module/launcher-git]
type = custom/text
format = " 󰊤 "
format-foreground = ${colors.foreground}
click-left = urxvt -e lazygit &


[module/launcher-wa]
type = custom/text
format = "  "
format-foreground = ${colors.foreground}
click-left = urxvt -e whatsapp-cli &

[module/launcher-opencode]
type = custom/text
format = "  "
format-foreground = ${colors.foreground}
click-left = urxvt -e opencode &
