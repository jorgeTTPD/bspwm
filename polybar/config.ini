[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #89b4fa
disabled = #6c7086
red = #f38ba8
peach = #fab387
yellow = #f9e2af
green = #a6e3a1
teal = #94e2d5
sky = #89dceb
sapphire = #74c7ec
overlay = #9399b2
surface = #45475a

[bar/mi_barra]
width = 98%
offset-x = 1%
offset-y = 6
height = 28
radius = 10
border-size = 1
border-color = ${colors.background-alt}
override-redirect = true
wm-restack = bspwm
pseudo-transparency = false
background = #99000000
foreground = ${colors.foreground}
padding-left = 0.5
padding-right = 0.5
module-margin = 0.8
tray-position = none

font-0 = "JetBrainsMono Nerd Font:size=10;3"
font-1 = "JetBrainsMono Nerd Font:size=14;3"

modules-left = arch checkupdates sep xworkspaces sep launcher-btop launcher-files launcher-pipe launcher-git launcher-opencode launcher-freebuff
modules-center = soundbar music-scroll
modules-right = cpu  memory  temperature space  network space space battery space space pulseaudio space brightness  date  powermenu


cursor-click = pointer
enable-ipc = true

[module/space]
type = custom/text
format = " "

[module/arch]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.sky}
format-padding = 1
click-left = rofi -show drun

[module/checkupdates]
type = custom/script
exec = ~/.config/polybar/scripts/checkupdates.sh
tail = false
interval = 600
format = <label>
format-padding = 1
label = %output%
label-foreground = ${colors.green}
click-left = urxvt -e sudo pacman -Syu &

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
tail = false
interval = 10
format = <label>
format-padding = 1
label = %output%
label-foreground = #ffffff
label-font = 1
click-left = blueman-manager &

[module/sep]
type = custom/text
format = "•"
format-foreground = ${colors.surface}
format-padding = 1

[module/xworkspaces]
type = internal/xworkspaces
label-active = 
label-active-foreground = ${colors.primary}
#label-active-background = #00000000
label-active-underline = ${colors.primary}
label-active-padding = 1
label-occupied = 
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/music-scroll]
type = custom/script
exec = ~/.config/polybar/scripts/music-scroll.sh
tail = false
interval = 2
format = <label>
format-padding = 1
format-underline = ${colors.surface}
format-line-size = 2
label = %output%
label-maxlen = 30
label-foreground = ${colors.foreground}
click-left = ~/.config/polybar/scripts/playerctl-active.sh play-pause
scroll-up = ~/.config/polybar/scripts/playerctl-active.sh next
scroll-down = ~/.config/polybar/scripts/playerctl-active.sh previous

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = #ffffff
format-padding = 1
label = %percentage:2%%
label-foreground = #ffffff

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = #ffffff
format-padding = 1
label = %percentage_used:2%%
label-foreground = #ffffff

[module/temperature]
type = internal/temperature
interval = 2
thermal-zone = 0
format = <label>
format-padding = 1
label =  %temperature-c%
label-foreground = #ffffff

[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
format-padding = 1
label-connected = 󰛴 %downspeed:7%
label-connected-foreground = #ffffff
label-disconnected = 󰖪 offline
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-padding = 1
label-charging = %percentage%%
label-charging-foreground = #ffffff
label-discharging = %percentage%%
label-discharging-foreground = #ffffff
label-full = %percentage%%
label-full-foreground = #ffffff

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = #ffffff

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = #ffffff
animation-charging-framerate = 750

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-padding = 1
label-volume = %percentage%%
label-volume-foreground = #ffffff
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = #ffffff
click-left = pavucontrol &
click-middle = pamixer -t &
scroll-up = pamixer -i 5 &
scroll-down = pamixer -d 5 &

[module/date]
type = internal/date
interval = 10
date = %H:%M
label = %date%
label-foreground = #ffffff
format-padding = 1

[module/brightness]
type = custom/script
exec = ~/.config/polybar/scripts/brightness.sh
tail = true
format = <label>
format-padding = 1
label = %output%
label-foreground = #ffffff
click-left = brightnessctl set +5%
click-right = brightnessctl set 5%-
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

[module/soundbar]
type = custom/script
exec = ~/.config/polybar/scripts/soundbar.sh
tail = true
format = <label>
format-padding = 1
label = %output%
label-foreground = #ffffff
format-font = 0

[module/launcher-btop]
type = custom/text
format = ""
format-foreground = ${colors.overlay}
format-font = 1
format-padding = 1
click-left = urxvt -e btop &

[module/launcher-files]
type = custom/text
format = "󰉋"
format-foreground = ${colors.overlay}
format-font = 1
format-padding = 1
click-left = urxvt -e yazi &

[module/launcher-pipe]
type = custom/text
format = "󰗃"
format-foreground = ${colors.overlay}
format-font = 1
format-padding = 1
click-left = urxvt -e pipe-viewer &

[module/launcher-git]
type = custom/text
format = "󰊤"
format-foreground = ${colors.overlay}
format-font = 1
format-padding = 1
click-left = urxvt -e lazygit &

[module/launcher-opencode]
type = custom/text
format = "󰆍"
format-foreground = ${colors.overlay}
format-font = 1
format-padding = 1
click-left = urxvt -e /home/jorge/.opencode/bin/opencode &

[module/launcher-freebuff]
type = custom/text
format = "󰚩"
format-foreground = ${colors.overlay}
format-font = 1
format-padding = 1
click-left = urxvt -e freebuff &

[module/powermenu]
type = custom/text
format = "  "
format-foreground = ${colors.red}
format-font = 1
format-padding = 1
click-left = ~/.config/scripts/powermenu_rofi.sh &
