[colors]
background = #1e1e2e
foreground = #cdd6f4

[bar/lyrics]
width = 80%
height = 22pt
radius = 10
offset-y = 35
override-redirect = true
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 10
padding-right = 10
module-margin = 0
enable-ipc = true

font-0 = "JetBrainsMono Nerd Font:size=11;2"

modules-center = lyric

[module/lyric]
type = custom/script
exec = ~/.config/polybar/scripts/lyric.sh
tail = true
format = <label>
label = %output%
label-foreground = #89b4fa
